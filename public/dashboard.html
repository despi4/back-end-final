<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="/">Blog API</a>
      <div class="ml-auto d-flex align-items-center">
        <a class="btn btn-outline-light btn-sm mr-2" href="/profile.html">Profile</a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alert" class="alert d-none" role="alert"></div>

      <div class="row">
        <div class="col-lg-5 mb-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Create Post</h5>
              <form id="postForm">
                <div class="form-group">
                  <label for="title">Title</label>
                  <input id="title" name="title" class="form-control" required minlength="3" />
                </div>
                <div class="form-group">
                  <label for="content">Content</label>
                  <textarea id="content" name="content" rows="5" class="form-control" required minlength="10"></textarea>
                </div>
                <div class="form-group">
                  <label for="tags">Tags (comma separated)</label>
                  <input id="tags" name="tags" class="form-control" placeholder="nodejs, express" />
                </div>
                <div class="form-group form-check">
                  <input id="isPublished" name="isPublished" type="checkbox" class="form-check-input" />
                  <label for="isPublished" class="form-check-label">Publish now</label>
                </div>
                <button type="submit" class="btn btn-primary">Save Post</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h5 class="card-title">My Posts</h5>
              <div id="myPosts" class="list-group"></div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Published Posts (Public)</h5>
              <div id="publicPosts" class="list-group"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/login.html";
      }

      const alertBox = document.getElementById("alert");
      const postForm = document.getElementById("postForm");
      const myPostsEl = document.getElementById("myPosts");
      const publicPostsEl = document.getElementById("publicPosts");

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      });

      function showMessage(message, type = "danger") {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || "Request failed");
        }

        return data;
      }

      function renderPostItem(post, canDelete = false) {
        const item = document.createElement("div");
        item.className = "list-group-item";

        const tags = (post.tags || []).map((tag) => `#${tag}`).join(" ");
        item.innerHTML = `
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h6 class="mb-1">${post.title}</h6>
              <p class="mb-1 text-muted">${post.content.slice(0, 140)}</p>
              <small class="text-secondary">${tags || "No tags"} | ${post.isPublished ? "Published" : "Draft"}</small>
            </div>
            ${canDelete ? '<button class="btn btn-sm btn-outline-danger">Delete</button>' : ""}
          </div>
        `;

        if (canDelete) {
          const btn = item.querySelector("button");
          btn.addEventListener("click", async () => {
            try {
              await api(`/posts/${post._id}`, { method: "DELETE" });
              showMessage("Post deleted", "success");
              await loadData();
            } catch (error) {
              showMessage(error.message, "danger");
            }
          });
        }

        return item;
      }

      async function loadData() {
        try {
          myPostsEl.innerHTML = "";
          publicPostsEl.innerHTML = "";

          const [myPosts, publicPosts] = await Promise.all([
            api("/posts"),
            fetch("/posts/public").then((response) => response.json()),
          ]);

          if (!Array.isArray(myPosts) || myPosts.length === 0) {
            myPostsEl.innerHTML = '<div class="list-group-item text-muted">No posts yet.</div>';
          } else {
            myPosts.forEach((post) => myPostsEl.appendChild(renderPostItem(post, true)));
          }

          if (!Array.isArray(publicPosts) || publicPosts.length === 0) {
            publicPostsEl.innerHTML = '<div class="list-group-item text-muted">No public posts.</div>';
          } else {
            publicPosts.forEach((post) => publicPostsEl.appendChild(renderPostItem(post, false)));
          }
        } catch (error) {
          showMessage(error.message, "danger");
        }
      }

      postForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          title: postForm.title.value.trim(),
          content: postForm.content.value.trim(),
          tags: postForm.tags.value
            .split(",")
            .map((tag) => tag.trim())
            .filter(Boolean),
          isPublished: postForm.isPublished.checked,
        };

        try {
          await api("/posts", {
            method: "POST",
            body: JSON.stringify(payload),
          });

          postForm.reset();
          showMessage("Post created", "success");
          await loadData();
        } catch (error) {
          showMessage(error.message, "danger");
        }
      });

      loadData();
    </script>
  </body>
</html>
