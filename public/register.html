<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Blog API</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-shell">
    <nav class="navbar navbar-expand-lg site-nav">
      <div class="container">
        <a class="navbar-brand brand-title" href="/">Blog API</a>
        <div class="ml-auto">
          <a class="btn btn-sm btn-soft mr-2" href="/">Home</a>
          <a class="btn btn-sm btn-brand" href="/login.html">Login</a>
        </div>
      </div>
    </nav>

    <main class="container auth-layout">
      <section class="glass-card card-body-tight auth-card fade-up">
        <p class="eyebrow mb-2">Get Started</p>
        <h2 class="mb-2">Create your account</h2>
        <p class="muted-note mb-3">After registration you can login and access the dashboard.</p>
        <div id="alert" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" class="form-control" required minlength="3" maxlength="50" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                required
                minlength="6"
                maxlength="72"
                autocomplete="new-password"
              />
              <div class="input-group-append">
                <button id="togglePasswordBtn" type="button" class="btn btn-soft">Show</button>
              </div>
            </div>
          </div>
          <button id="submitBtn" class="btn btn-brand btn-block" type="submit">Create Account</button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <a href="/login.html">Already have account? Login</a>
          <small class="muted-note">API: <code id="apiBaseText"></code></small>
        </div>
      </section>
    </main>

    <script src="/app-config.js"></script>
    <script src="/app-common.js"></script>
    <script>
      const form = document.getElementById("registerForm");
      const alertBox = document.getElementById("alert");
      const submitBtn = document.getElementById("submitBtn");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const passwordInput = document.getElementById("password");
      document.getElementById("apiBaseText").textContent = window.APP_CONFIG.apiBase;

      const client = window.AppCommon.createApiClient("");

      togglePasswordBtn.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePasswordBtn.textContent = show ? "Hide" : "Show";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        window.AppCommon.setButtonBusy(submitBtn, true, "Create Account", "Creating...");

        const payload = {
          username: form.username.value.trim(),
          email: form.email.value.trim(),
          password: form.password.value,
        };

        try {
          await client.request("/auth/register", {
            method: "POST",
            auth: "none",
            body: payload,
          });

          form.reset();
          window.AppCommon.showAlert(alertBox, "Registration successful. Redirecting to login...", "success");
          window.setTimeout(() => {
            window.location.href = "/login.html";
          }, 650);
        } catch (error) {
          window.AppCommon.showAlert(alertBox, error.message || "Registration failed", "danger");
        } finally {
          window.AppCommon.setButtonBusy(submitBtn, false, "Create Account");
        }
      });
    </script>
  </body>
</html>
