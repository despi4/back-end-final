<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Blog API</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-shell">
    <nav class="navbar navbar-expand-lg site-nav">
      <div class="container">
        <a class="navbar-brand brand-title" href="/">Blog API</a>
        <div class="ml-auto d-flex align-items-center flex-wrap">
          <a class="btn btn-sm btn-soft mr-2 mb-1 mb-sm-0" href="/dashboard.html">Dashboard</a>
          <button id="logoutBtn" class="btn btn-sm btn-accent mb-1 mb-sm-0" type="button">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container app-container">
      <div id="alert" class="alert d-none" role="alert"></div>
      <section class="row">
        <div class="col-lg-7 mb-4 fade-up">
          <div class="glass-card card-body-tight">
            <p class="eyebrow mb-2">Account</p>
            <h3 class="mb-2">Profile Settings</h3>
            <p class="muted-note mb-3">Update username and email used for authentication.</p>
            <form id="profileForm">
              <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" class="form-control" required minlength="3" maxlength="50" />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" class="form-control" required />
              </div>
              <div class="form-group">
                <label for="role">Role</label>
                <input id="role" name="role" class="form-control" disabled />
              </div>
              <button id="saveProfileBtn" type="submit" class="btn btn-brand">Save Changes</button>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="glass-card card-body-tight mb-4 fade-up stagger-1">
            <h5 class="mb-3">Account Overview</h5>
            <div class="row">
              <div class="col-6 mb-2">
                <div class="stat-card">
                  <p class="stat-label">My posts</p>
                  <p class="stat-value" id="totalPostsStat">0</p>
                </div>
              </div>
              <div class="col-6 mb-2">
                <div class="stat-card">
                  <p class="stat-label">Published</p>
                  <p class="stat-value" id="publishedPostsStat">0</p>
                </div>
              </div>
            </div>
            <div class="stat-card mt-2">
              <p class="stat-label">Drafts</p>
              <p class="stat-value" id="draftPostsStat">0</p>
            </div>
          </div>

          <div class="glass-card card-body-tight mb-4 fade-up stagger-2">
            <h6 class="mb-2">Profile Metadata</h6>
            <p class="mb-1"><strong>Created:</strong> <span id="createdAt">-</span></p>
            <p class="mb-0"><strong>Updated:</strong> <span id="updatedAt">-</span></p>
          </div>

          <div class="glass-card card-body-tight fade-up stagger-3">
            <h6 class="mb-2">API Settings</h6>
            <label for="apiBaseInput">Backend URL</label>
            <div class="input-group">
              <input id="apiBaseInput" class="form-control" autocomplete="off" />
              <div class="input-group-append">
                <button id="saveApiBaseBtn" class="btn btn-soft" type="button">Apply</button>
              </div>
            </div>
            <small class="muted-note d-block mt-2">Page reloads after update.</small>
          </div>
        </div>
      </section>
    </main>

    <script src="/app-config.js"></script>
    <script src="/app-common.js"></script>
    <script>
      const token = window.AppCommon.getToken();
      if (!token) {
        window.location.href = "/login.html";
      }

      const client = window.AppCommon.createApiClient(token);
      const alertBox = document.getElementById("alert");
      const profileForm = document.getElementById("profileForm");
      const saveProfileBtn = document.getElementById("saveProfileBtn");
      const apiBaseInput = document.getElementById("apiBaseInput");

      apiBaseInput.value = window.APP_CONFIG.apiBase;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.AppCommon.clearAuth();
        window.location.href = "/login.html";
      });

      document.getElementById("saveApiBaseBtn").addEventListener("click", () => {
        const value = apiBaseInput.value.trim().replace(/\/+$/, "");
        if (value) {
          window.localStorage.setItem("apiBase", value);
        } else {
          window.localStorage.removeItem("apiBase");
        }
        window.location.reload();
      });

      function renderPostStats(posts) {
        const total = posts.length;
        const published = posts.filter((post) => post.isPublished).length;
        const drafts = total - published;

        document.getElementById("totalPostsStat").textContent = String(total);
        document.getElementById("publishedPostsStat").textContent = String(published);
        document.getElementById("draftPostsStat").textContent = String(drafts);
      }

      async function loadProfileData() {
        try {
          const [profile, posts] = await Promise.all([
            client.request("/users/profile", { auth: "required" }),
            client.request("/posts", { auth: "required" }),
          ]);

          profileForm.username.value = profile.username || "";
          profileForm.email.value = profile.email || "";
          profileForm.role.value = profile.role || "user";
          document.getElementById("createdAt").textContent = window.AppCommon.formatDate(profile.createdAt);
          document.getElementById("updatedAt").textContent = window.AppCommon.formatDate(profile.updatedAt);
          renderPostStats(Array.isArray(posts) ? posts : []);

          window.AppCommon.setAuth(token, {
            id: profile.id,
            username: profile.username,
            email: profile.email,
            role: profile.role,
          });
        } catch (error) {
          window.AppCommon.showAlert(alertBox, error.message || "Failed to load profile", "danger");
        }
      }

      profileForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        window.AppCommon.setButtonBusy(saveProfileBtn, true, "Save Changes", "Saving...");

        const payload = {
          username: profileForm.username.value.trim(),
          email: profileForm.email.value.trim(),
        };

        try {
          const updated = await client.request("/users/profile", {
            method: "PUT",
            auth: "required",
            body: payload,
          });

          window.AppCommon.setAuth(token, {
            id: updated.id,
            username: updated.username,
            email: updated.email,
            role: updated.role,
          });
          window.AppCommon.showAlert(alertBox, "Profile updated", "success", 3000);
          await loadProfileData();
        } catch (error) {
          window.AppCommon.showAlert(alertBox, error.message || "Update failed", "danger");
        } finally {
          window.AppCommon.setButtonBusy(saveProfileBtn, false, "Save Changes");
        }
      });

      loadProfileData();
    </script>
  </body>
</html>
